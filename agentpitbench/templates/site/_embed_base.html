<!doctype html>
<html lang="{{ lang }}"{% if rtl %} dir="rtl"{% endif %}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{ title }}</title><link rel="canonical" href="{{ full_url }}">
{% if oembed %}<link rel="alternate" type="application/json+oembed" href="{{ oembed }}" title="{{ title }}">{% endif %}
<script>/* ?theme=light|dark, ?size=compact (docs/embed-spec.md §2) */(function(){var q=new URLSearchParams(location.search),h=document.documentElement,t=q.get("theme");if(t==="light"||t==="dark")h.setAttribute("data-theme",t);if(q.get("size")==="compact")h.setAttribute("data-size","compact")})();</script>
<style>
:root{--bg:#fff;--fg:#0b1020;--mut:#5b6582;--line:#e3e6f0;--pos:#15803d;--neg:#d6284b;--tag:#eef0f7;--acc:#4f46e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--fg:#eef1f8;--mut:#9aa4c4;--line:#253058;--pos:#34d399;--neg:#ff6b86;--tag:#1b2448;--acc:#9ea8ff;color-scheme:dark}}
:root[data-theme=dark]{--lgd:inline;--lgl:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--lgd:inline;--lgl:none}}
:root[data-theme=dark]{--bg:#0b1020;--fg:#eef1f8;--mut:#9aa4c4;--line:#253058;--pos:#34d399;--neg:#ff6b86;--tag:#1b2448;--acc:#9ea8ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px 12px;overflow-wrap:anywhere}
a{color:inherit}.w{max-width:100%}
.h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;letter-spacing:.5px;font-size:12px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.q{font-weight:700;font-size:16px;line-height:1.3;margin:2px 0 6px;display:block;text-decoration:none}.q:hover{text-decoration:underline}
.tag{display:inline-block;background:var(--tag);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--fg)}
.tag.live{background:#d6284b;color:#fff}
table{width:100%;border-collapse:collapse}th{font-size:11px;font-weight:600;color:var(--mut);text-align:start;padding:4px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}.r{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
[dir=rtl] .r{direction:ltr;text-align:left}
.nw{white-space:nowrap;font-weight:700}.mi{vertical-align:middle;margin-inline-end:6px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero,.mut{color:var(--mut)}.small{font-size:12px}
.c td{color:var(--mut);border-top:2px dashed var(--line)}.won{font-weight:700}
.cred{margin-top:8px;font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px}.cred a{color:var(--acc);font-weight:700;text-decoration:none}
:root[data-size=compact] .full{display:none}
@media (max-width:340px){.full2{display:none}body{padding:8px}}
</style></head>
<body data-kind="{{ kind }}" data-poll="{{ poll or '' }}" data-sig="{{ state_sig }}" data-every="{{ every }}">{{ mascot_sprite(root) }}
<div class="w">{% block body %}{% endblock %}
<div class="cred"><span>{{ _("Methodology v{v}", v=s.methodology_version) }}</span><span>·</span><span>{{ _("{n} betting rounds resolved", n=n_resolved) }}</span><span>·</span><a href="{{ back_url }}" data-utm target="_blank" rel="noopener">AgentpitBench ↗</a></div></div>
<script>/* no cookies, no storage, no analytics (docs/embed-spec.md §3-6) */(function(){var host="iframe";try{var a=location.ancestorOrigins,u=a&&a.length?a[0]:document.referrer;if(u)host=new URL(u).hostname||host}catch(e){}
document.querySelectorAll("a[data-utm]").forEach(function(l){try{var u=new URL(l.href);u.searchParams.set("utm_medium",host);l.href=u.toString()}catch(e){}});
document.querySelectorAll("a[href]").forEach(function(l){l.target="_blank";l.rel="noopener"});
function post(){if(parent!==window)parent.postMessage({type:"agentpitbench:height",height:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*")}
post();addEventListener("load",post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
var b=document.body,P=b.getAttribute("data-poll"),S=b.getAttribute("data-sig"),K=b.getAttribute("data-kind");if(!P)return;
setInterval(function(){fetch(P,{cache:"no-cache"}).then(function(r){return r.json()}).then(function(j){var d=j.data||{},sig=K==="round"?d.state+"|"+d.sealed:j.as_of;if(!sig||sig===S)return;
var q=new URLSearchParams(location.search);if(q.get("v")===j.as_of)return;q.set("v",j.as_of);location.replace(location.pathname+"?"+q.toString())}).catch(function(){})},+b.getAttribute("data-every")||60000)})();</script>
{% block scripts %}{% endblock %}</body></html>
