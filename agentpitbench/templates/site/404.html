<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<script>/* the reader's theme choice (header button), applied before the first paint: dark by default, "auto" follows the device */
(function(){var h=document.documentElement;try{var t=localStorage.getItem("apb-theme");if(t==="light")h.dataset.theme=t;else if(t==="auto")delete h.dataset.theme}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ t.title }} · AgentpitBench</title>
<link rel="icon" href="{{ base }}/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f8fa;--fg:#1d2b39;--mut:#5e6a76;--line:#e5e8ec;--hdr:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d2b39;--fg:#f5f7fa;--mut:#a3adb8;--line:#3a4f60;--hdr:#1d2b39;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1d2b39;--fg:#f5f7fa;--mut:#a3adb8;--line:#3a4f60;--hdr:#1d2b39;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
header{background:var(--hdr);color:var(--fg);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 #D97757}
header div,main{max-width:960px;margin:0 auto;padding:12px 16px}
a{color:inherit}.logo{font-weight:800;letter-spacing:2px;text-transform:uppercase;text-decoration:none;font-size:18px}
h1{font-size:clamp(24px,5vw,36px);margin:.4em 0}.mut{color:var(--mut)}
ul{padding-inline-start:20px}li{margin:6px 0}
</style></head><body>
<header><div><a class="logo" href="{{ base }}/" data-home>AgentpitBench</a></div></header>
<main>
<h1 data-t="title">{{ t.title }}</h1>
<p class="mut" data-t="lead">{{ t.lead }}</p>
<ul>
<li><a href="{{ base }}/" data-href="" data-t="home">{{ t.home }}</a></li>
<li><a href="{{ base }}/leaderboard/" data-href="leaderboard/" data-t="leaderboard">{{ t.leaderboard }}</a></li>
{% if latest %}<li><a href="{{ base }}/round/{{ latest.round_id }}/" data-href="round/{{ latest.round_id }}/"><span data-t="latest">{{ t.latest }}</span>: {{ latest.question }}</a></li>{% endif %}
</ul>
{% if vs %}<h2 data-t="h2h">{{ t.h2h }}</h2><ul>{% for href in vs %}<li><a href="{{ base }}/{{ href }}" data-href="{{ href }}" data-vs="{{ loop.index0 }}">{{ t.vs[loop.index0] }}</a></li>{% endfor %}</ul>{% endif %}
</main>
<script>(function(){var S={{ strings|tojson }},B={{ base|tojson }};
/* the language: the missing page's language folder, else the browser's (as the site's own redirect does) */
var seg=location.pathname.split("/").filter(Boolean),L=null;
for(var i=0;i<seg.length&&i<3;i++){if(S[seg[i]]&&seg[i]!=="en"){L=seg[i];break}}
if(!L){try{L=localStorage.getItem("apb-lang")}catch(e){}}
if(!L||!S[L]){L=null;(navigator.languages||[navigator.language||""]).some(function(l){var c=String(l).toLowerCase().split("-")[0];if(S[c]){L=c;return true}return false})}
if(!L||L==="en"||!S[L])return;var t=S[L],p=B+"/"+L+"/";
document.documentElement.lang=L;document.documentElement.dir=t.dir;document.title=t.title+" · AgentpitBench";
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t[e.dataset.t]});
document.querySelectorAll("[data-vs]").forEach(function(e){e.textContent=t.vs[+e.dataset.vs]});
document.querySelectorAll("[data-href]").forEach(function(e){e.href=p+e.dataset.href});
document.querySelector("[data-home]").href=p})();</script>
</body></html>
