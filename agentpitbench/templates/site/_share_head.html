{#- Share UX (docs/share-ux-v2-spec.md): CSS only, included inside base.html's <style> so every share control is
    styled before it is painted (no layout shift). html.ns = a phone with a native share sheet (set before the row). -#}
.share{max-width:960px;margin:0 auto 24px;padding:0 16px}.share h2{font-size:14px;margin:0 0 8px;color:var(--mut)}
.share .row,.share .nets{display:flex;flex-wrap:wrap;gap:8px}.share .row:not(:empty){margin-bottom:8px}
.share .btn,.shrow .btn{min-height:44px;display:inline-flex;align-items:center;background:var(--card);color:var(--fg);cursor:pointer;font:inherit;font-weight:700;font-size:15px}
.share .btn.cta,.shrow .btn.cta{background:#ff3b5c;color:#fff}.shrow .btn.dark{background:var(--fg);color:var(--bg)}.share [hidden]{display:none!important}
.share input{width:100%;max-width:560px;min-height:44px;margin-top:8px;padding:8px;font:14px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.share details.embed{margin-top:8px}.share summary{list-style:none;width:max-content}.share summary::-webkit-details-marker{display:none}
.share textarea{display:block;width:100%;max-width:560px;margin:8px 0;padding:8px;font:13px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--card);color:var(--fg);resize:vertical}
.share .ok,.shrow .ok{margin-inline-start:8px;color:var(--pos);font-weight:700;font-size:14px;align-self:center}
.shrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:flex-start}
.shrow .btn.sm{min-height:44px;padding:4px 12px;font-size:14px}
.shrow details[open]{flex-basis:100%}.shrow summary{list-style:none}.shrow summary::-webkit-details-marker{display:none}
.shrow summary::after{content:"▾";margin-inline-start:6px}.shrow details[open] summary{background:var(--fg);color:var(--bg)}
.shrow .pop{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
html:not(.ns) .shrow [data-native],html.ns .shrow>[data-net],html.ns .shrow>[data-save]{display:none}
html:not(.ns) .shrow .pop [data-top]{display:none}
.rbox{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--pos);padding:12px 14px 2px;margin:12px 0}
.rbox pre{margin:0;padding:0;border:0;background:none;font:600 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.qs{margin:8px 0 4px;align-items:center}.qs .ql{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px}html.ns .qs .ql{display:none}.qs .btn.sm{min-height:44px}
.fwrap{position:relative}.fend{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;background:rgba(11,16,32,.82);padding:12px}
.fend[hidden]{display:none}.fend .fl{flex-basis:100%;text-align:center;color:#fff}html.ns .fend .fl{display:none}.fend .ok{color:#7ef0b5}.fend .btn{background:#fff;color:#0b1020;border-color:#fff;min-height:44px;display:inline-flex;align-items:center;font:inherit;font-weight:700;cursor:pointer}.fend .btn.cta{background:#ff3b5c;border-color:#ff3b5c;color:#fff}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:52px;height:52px;border-radius:50%;border:0;background:#ff3b5c;color:#fff;
display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;opacity:0;transition:opacity .2s}
html.ns .fab{display:flex}html.ns .fab.on{opacity:1}.fab:not(.on){visibility:hidden}
html.ns{scroll-padding-bottom:84px}
@media (prefers-reduced-motion:reduce){.fab{transition:none}}
