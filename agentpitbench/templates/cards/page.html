<!doctype html>
<html lang="{{ lang }}"{% if rtl %} dir="rtl"{% endif %}><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=block" rel="stylesheet">
<style>
/* The branded link preview: emblem, page title, site address. 1200x630, seen ~400px wide in a feed. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(900px 520px at 0% 0%,#1d2a55 0%,transparent 60%),linear-gradient(160deg,#0b1020 0%,#121a36 100%);
color:#f4f6fb;font-family:Inter,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil",
"Noto Sans Telugu","Noto Sans Gurmukhi","Noto Sans Gujarati","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Oriya",
"Noto Sans Thai","Noto Sans Myanmar","Noto Sans Ethiopic","Noto Naskh Arabic","Noto Sans CJK SC","Noto Sans CJK JP",
"Noto Sans CJK KR","DejaVu Sans",sans-serif;position:relative}
.bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:18px;background:linear-gradient(180deg,#D97757 0 25%,#10A37F 25% 50%,#4285F4 50% 75%,#E8FF3A 75%)}
.in{position:absolute;inset:0;padding:0 90px 0 96px;display:flex;align-items:center;gap:64px}
.em{flex:0 0 300px;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #0b1020,0 0 0 10px #253058}
.em svg{display:block;width:300px;height:300px}
.txt{flex:1;min-width:0}
.brand{font-family:Oswald,"DejaVu Sans Condensed",sans-serif;font-weight:700;font-size:40px;letter-spacing:4px;text-transform:uppercase;color:#E8FF3A}
.t{font-weight:800;font-size:{{ 76 if title|length <= 24 else 62 if title|length <= 40 else 50 }}px;line-height:1.12;margin-top:14px;
overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
html:not([lang=en]) .t{line-height:1.38}  /* Indic, Arabic and CJK scripts: room for marks above and below */
.sub{font-size:30px;color:#cfd6ea;margin-top:18px}
.host{position:absolute;inset-inline-end:56px;bottom:40px;font-family:Oswald,"DejaVu Sans Condensed",sans-serif;font-size:32px;color:#9aa4c4;letter-spacing:1px}
</style></head><body>
<div class="bar"></div>
<div class="in"><div class="em">{{ emblem(300, True) }}</div>
<div class="txt"><div class="brand"><bdi dir="ltr">AgentpitBench</bdi></div><div class="t">{{ title }}</div>{% if sub %}<div class="sub">{{ sub }}</div>{% endif %}</div></div>
<div class="host" dir="ltr">{{ host }}</div>
</body></html>
