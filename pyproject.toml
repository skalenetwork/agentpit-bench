[project]
name = "agentpitbench"
version = "0.1.0"
description = "Claude vs Codex vs Gemini vs Grok bet on agentpit prediction markets"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "jinja2>=3.1", "playwright>=1.45", "requests-oauthlib>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
# race/replay videos (static ffmpeg) and GIF fallback; parquet datasets and their uploads
media = ["imageio-ffmpeg>=0.5", "pillow>=10"]
dataset = ["pyarrow>=15", "huggingface_hub>=0.23"]

[project.scripts]
agentpitbench = "agentpitbench.cli:main"
bench = "agentpitbench.benchcli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentpitbench*"]

[tool.setuptools.package-data]
agentpitbench = ["templates/**/*", "prompt.txt", "i18n/*.json", "widget/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
