# AgentpitBench settings. Secrets never go here: see README.

api_url = "https://api.agentpit.dev"
# agentpit.dev has no per-market pages: bet links go to its onboarding, tagged with the market
market_url = "https://agentpit.dev/start?market={slug}"
site_url = "https://agentpitbench.org"
# Cloudflare Web Analytics beacon on every site page (the token is public by design; empty = off)
cf_analytics_token = "7f12b95829f74ed488cdf4008a176a57"
# Search engines (docs/seo-spec.md §5); empty = omitted. Google: the meta-tag token from Search Console, or the
# whole verification file name ("google0123abcd.html") for the file method. Bing: the msvalidate.01 token (served as
# the meta tag and as /BingSiteAuth.xml).
# google_site_verification = ""
# bing_site_verification = ""
# IndexNow (Bing, Yandex, Seznam): announce new and resolved rounds after each deploy
# indexnow_enabled = false
data_dir = "var"

poll_interval_s = 60
batch_interval_s = 3600
resolution_check_s = 300
decision_limit_s = 300
restart_min_remaining_s = 120
stake = 100
max_concurrent_rounds = 3
daily_round_cap = 10   # methodology v1.2 (the lock wins anyway)
# X analytics: @agentpitbench owns the developer app (operator-confirmed 2026-10-12), so metrics are read from
# the own-timeline endpoint and priced as Owned Reads ($0.001). Check the console's usage page on day 1.
x_app_owned = true
max_days_to_close = 7
void_after_days = 14
deploy_debounce_s = 30

# dry_run: everything runs except placing orders, posting tweets and pushing the site.
dry_run = true
# kill switch: when true, nothing is posted to X even outside dry-run.
posting_paused = false
# operator 2026-10-13: two posts per market on X (and its mirrors): the opening (reveal) and the closing
# (results). No replies, no press, films, replays, awards, reports or other extra posts.
# operator 2026-10-27 virality push: adds grok_ask and labs_week (overrides the 10-13 two-posts-per-market rule for these two; report_month: the monthly report thread)
post_kinds = ["reveal", "results", "week", "motd", "reply-back", "grok_ask", "labs_week", "report_month", "shoutout",   # + weekly episode, daily film, F2 reply-back (operator 2026-10-13; X "Automated" label set)
              "digest", "results_digest",   # operator 2026-10-27 posts v3: the daily board and results digest
              "debate", "hype", "confession", "hot_take", "humans_week", "grudge", "soap"]   # operator 2026-10-27 posts v3
grok_ask_enabled = true     # daily "@grok, who's right?" quote of the best split reveal (X only, not mirrored)
labs_week_enabled = true    # Sunday: this week's P&L per AI, tagging the four labs (mirrored with lab names)
summons_line_every = 3      # "Want the AIs on your market? Tag @agentpitbench" on ~1 in 3 results posts (X only)
# operator 2026-10-27 engagement: like human pick replies, shout out a human who beat all the AIs, follow back
x_like_replies = true
x_shoutouts = true
x_follow_back = true
posts_v3 = true           # operator 2026-10-27 posts v3: Pit Boss voice, top-3 reveals, daily board + results digest, no reveals on Bluesky
debate_enabled = true      # operator 2026-10-27 posts v3: AI debate thread under each top-3 reveal (split picks only)
hype_enabled = true        # operator 2026-10-27 posts v3: KICKOFF IN 1 HOUR quote of a top-3 reveal (no picks)
confession_enabled = true  # operator 2026-10-27 posts v3: a losing AI's own words, 1 a day
hot_take_enabled = true    # operator 2026-10-27 posts v3: daily leaderboard question (14 UTC)
humans_week_enabled = true # operator 2026-10-27 posts v3: Sunday humans shout-out + champion (17 UTC)
grudge_enabled = true      # operator 2026-10-27 posts v3: Monday grudge match (12 UTC)
soap_enabled = true        # operator 2026-10-27 posts v3: daily THE PIT episode (19 UTC)
reveal_window = true      # virality-2 F1: the reveal waits for its live window (T-3h .. T-15min before kickoff)
# operator 2026-10-27: AI scene per post (Gemini), bold cartoon. Needs GEMINI_API_KEY in secrets.env (billing-enabled
# project); without it every post silently keeps today's card. See docs/scene-images.md.
scene_images_enabled = true
scene_movie = true          # operator 2026-10-27: per market a movie idea -> its poster -> each post image starts from the poster
# scene_images_model = "gemini-3.1-flash-image"
# scene_images_per_day = 30

agents = ["claude", "codex", "agy", "grok"]
excluded_keywords = ["death", "dies", "die ", "killed", "shooting", "war ", "attack", "terror", "earthquake", "hurricane", "flood", "wildfire", "disaster", "casualt", "murder", "assassinat", "elon musk post"]
# "elon musk post": many near-identical tweet-count brackets on one question would crowd out real variety

# Match of the Day: daily film of the most dramatic resolved round, posted at motd_hour_utc
motd_enabled = true   # scripted films approved by the operator 2026-10-12
motd_daily = true     # operator 2026-10-13: the daily Match of the Day film is back on (posted as one X post, no link reply)

# Operator AI (docs/ai-automation-spec.md): own login in ~/.config/agentpitbench/opai-claude (done 2026-10-12).
opai_enabled = true
opai_calls_per_day = 250   # raised 2026-10-12 (operator); watch for contestant usage-limit failures (breaker stops opai)


# Bluesky mirror (docs/bluesky-spec.md): @agentpitbench.org, login by DID from secrets.env
bluesky_enabled = true
bluesky_did = "did:plc:djokzafo745ypvzw5ihxghgp"
# Telegram channel mirror (docs/telegram-spec.md §7): TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL in secrets.env
telegram_enabled = true

# Week in the Pit (docs/week-in-the-pit-spec.md): weekly episode, Sundays 18:00 UTC
week_episode_enabled = true
# Monthly report "Which AI is the best forecaster?": thread + 60 s film on the 1st of each month, 15:00 UTC (operator 2026-10-27 virality push)
report_month_enabled = true

# Operator decisions 2026-10-12: YouTube AI-narrator disclosure; cadence + selection reviewers in shadow/propose mode
youtube_synthetic_media = true
cadence_enabled = true
cadence_apply = true        # operator: apply automatically (one knob a day, hard bounds in code)
selection_review_enabled = true
# Operator decision 2026-10-12 (later): the weekly selection review applies its proposal itself (bounded,
# versioned, logged; revert with `agentpitbench method revert <version>`)
selection_auto_apply = true
opai_tasks = ["rate", "picks", "summary", "incident", "i18n", "translate", "motd_script", "weekly_episode",
              "cadence", "proposal", "ab", "release_tweet", "post"]   # post: posts v3 writer (operator 2026-10-27); release_tweet: the operator's daily X draft (announce.py)
ab_gen_enabled = true      # operator 2026-10-12: Claude-written variants on (code validator + live control arm)
# Backend (docs/backend-api.md): Worker live at api.agentpitbench.org since 2026-10-19; Google client in project
# agentpitbench-site (public id; the Worker holds the same value as its GOOGLE_CLIENT_ID secret)
backend_enabled = true
# Open dataset: first upload 2026-10-19 (skalenetwork/agentpitbench); operator: refresh and upload automatically, no asking
hf_dataset_refresh = true
# Summons ("Ask the AIs"): operator 2026-10-27 raised from 1 to 3 a day to promote it
summons_per_day = 3
google_client_id = "746045421828-4g0cl45n845c7d35j8j88bufghu1dhkq.apps.googleusercontent.com"

[opai_task_budget]         # overrides only the tasks named here (code defaults for the rest); translate raised for the backfill
rate = 24
picks = 12
summary = 12
incident = 4
cadence = 1
report = 2
i18n = 8               # batched: up to 10 languages per call
proposal = 2               # the weekly review plus one retry told why the first answer was rejected
ab = 2
translate = 80          # 3 calls per round (13 languages each): ~26 rounds/day during the backfill
motd_script = 15       # a film per round (5/day), each with one retry
post = 24              # operator 2026-10-27 posts v3 writer: ~15 posts/day + retries; templates beyond it
