# AgentpitBench settings. Secrets never go here: see README.

api_url = "https://api.agentpit.dev"
# agentpit.dev has no per-market pages: bet links go to its onboarding, tagged with the market
market_url = "https://agentpit.dev/start?market={slug}"
site_url = "https://agentpitbench.org"
# Cloudflare Web Analytics beacon on every site page (the token is public by design; empty = off)
cf_analytics_token = "7f12b95829f74ed488cdf4008a176a57"
# Search engines (docs/seo-spec.md §5); empty = omitted. Google: the meta-tag token from Search Console, or the
# whole verification file name ("google0123abcd.html") for the file method. Bing: the msvalidate.01 token (served as
# the meta tag and as /BingSiteAuth.xml).
# google_site_verification = ""
# bing_site_verification = ""
# IndexNow (Bing, Yandex, Seznam): announce new and resolved rounds after each deploy
# indexnow_enabled = false
data_dir = "var"

poll_interval_s = 60
batch_interval_s = 3600
resolution_check_s = 300
decision_limit_s = 300
restart_min_remaining_s = 120
stake = 100
max_concurrent_rounds = 3
daily_round_cap = 5
# X analytics: @agentpitbench owns the developer app (operator-confirmed 2026-10-12), so metrics are read from
# the own-timeline endpoint and priced as Owned Reads ($0.001). Check the console's usage page on day 1.
x_app_owned = true
max_days_to_close = 7
void_after_days = 14
deploy_debounce_s = 30

# dry_run: everything runs except placing orders, posting tweets and pushing the site.
dry_run = true
# kill switch: when true, nothing is posted to X even outside dry-run.
posting_paused = false
# operator 2026-10-13: two posts per market on X (and its mirrors): the opening (reveal) and the closing
# (results). No replies, no press, films, replays, awards, reports or other extra posts.
post_kinds = ["reveal", "results"]

agents = ["claude", "codex", "agy", "grok"]
excluded_keywords = ["death", "dies", "die ", "killed", "shooting", "war ", "attack", "terror", "earthquake", "hurricane", "flood", "wildfire", "disaster", "casualt", "murder", "assassinat", "elon musk post"]
# "elon musk post": many near-identical tweet-count brackets on one question would crowd out real variety

# Match of the Day: daily film of the most dramatic resolved round, posted at motd_hour_utc
motd_enabled = true   # scripted films approved by the operator 2026-10-12

# Operator AI (docs/ai-automation-spec.md): own login in ~/.config/agentpitbench/opai-claude (done 2026-10-12).
opai_enabled = true
opai_calls_per_day = 250   # raised 2026-10-12 (operator); watch for contestant usage-limit failures (breaker stops opai)


# Bluesky mirror (docs/bluesky-spec.md): @agentpitbench.org, login by DID from secrets.env
bluesky_enabled = true
bluesky_did = "did:plc:djokzafo745ypvzw5ihxghgp"
# Telegram channel mirror (docs/telegram-spec.md §7): TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL in secrets.env
telegram_enabled = true

# Week in the Pit (docs/week-in-the-pit-spec.md): weekly episode, Sundays 18:00 UTC
week_episode_enabled = true

# Operator decisions 2026-10-12: YouTube AI-narrator disclosure; cadence + selection reviewers in shadow/propose mode
youtube_synthetic_media = true
cadence_enabled = true
cadence_apply = true        # operator: apply automatically (one knob a day, hard bounds in code)
selection_review_enabled = true
# Operator decision 2026-10-12 (later): the weekly selection review applies its proposal itself (bounded,
# versioned, logged; revert with `agentpitbench method revert <version>`)
selection_auto_apply = true
opai_tasks = ["rate", "picks", "summary", "incident", "i18n", "translate", "motd_script", "weekly_episode",
              "cadence", "proposal", "ab"]
ab_gen_enabled = true      # operator 2026-10-12: Claude-written variants on (code validator + live control arm)

[opai_task_budget]         # overrides only the tasks named here (code defaults for the rest); translate raised for the backfill
rate = 24
picks = 12
summary = 12
incident = 4
cadence = 1
report = 2
i18n = 8               # batched: up to 10 languages per call
proposal = 1
ab = 2
translate = 80          # 3 calls per round (13 languages each): ~26 rounds/day during the backfill
motd_script = 15       # a film per round (5/day), each with one retry
