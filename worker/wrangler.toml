# AgentpitBench API Worker (contract: docs/backend-api.md, v1).
# Deploy steps: worker/README.md. Nothing here is secret; secrets are set with
# `npx wrangler secret put` (GOOGLE_CLIENT_ID, SESSION_SECRET, BENCH_INGEST_KEY).
name = "agentpitbench-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
# Custom domain api.agentpitbench.org (Cloudflare creates the DNS record and certificate on deploy).
routes = [
  { pattern = "api.agentpitbench.org", custom_domain = true }
]

[vars]
# Exact origin allowed for credentialed CORS.
ALLOWED_ORIGIN = "https://agentpitbench.org"
# "1" also allows http://localhost:<port> and http://127.0.0.1:<port> (dev only; keep "0" in production).
ALLOW_LOCALHOST = "0"
# Season start (UTC date). "season" on the scoreboard = markets locking on/after this date.
SEASON_START = "2026-10-01"
# Free API v2 (docs/free-api-spec.md). "0" switches /v2/ off (503) at the next deploy; the operator can also switch
# it off at once without a deploy: `agentpitbench api --off` (POST /v1/admin/api).
API_V2_ENABLED = "1"
API_ANON_PER_HOUR = "60"     # without a key, per IP
API_KEY_PER_DAY = "10000"    # per key (the operator can raise one key's limit: agentpitbench api-keys --limit)
API_KEY_PER_SECOND = "10"
API_KEYS_PER_USER = "3"

[[d1_databases]]
binding = "DB"
database_name = "agentpitbench"
# Created 2026-10-19 (npx wrangler d1 create agentpitbench).
database_id = "5ecdda59-8737-470d-ab04-cbd262f98e3c"
